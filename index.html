<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz · As 5 Linguagens do Perdão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--berry:#2E5D52;--deep:#22473E;--rose:#7FA08F;--blush:#E6EEE8;--ink:#36433D;--muted:#7A8C82;--white:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--deep) 0%,var(--berry) 55%,#3a7d6a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--white);width:100%;max-width:540px;border-radius:22px;box-shadow:0 18px 50px rgba(12,40,32,.35);overflow:hidden}
.inner{padding:30px 26px 28px}
@media(max-width:420px){.inner{padding:24px 18px 22px}}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.68rem;font-weight:700;color:var(--rose);text-align:center;margin-bottom:4px}
.hearts{display:flex;justify-content:center;margin-bottom:10px}
.hearts svg{width:30px;height:30px}
.hearts svg:last-child{margin-left:-9px}
.progress-wrap{display:flex;align-items:center;gap:12px;margin:14px 0 22px}
.progress{flex:1;height:8px;background:var(--blush);border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0%;background:var(--rose);border-radius:99px;transition:width .35s ease}
.count{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap}
.qtitle{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--berry);text-align:center;margin-bottom:4px}
.qsub{text-align:center;color:var(--muted);font-size:.84rem;margin-bottom:20px}
.opt{display:block;width:100%;text-align:left;background:var(--blush);border:2px solid transparent;border-radius:16px;padding:18px;margin-bottom:13px;cursor:pointer;font:500 1rem/1.5 'Karla',sans-serif;color:var(--ink);transition:border-color .15s,background .15s,transform .12s}
.opt:hover{border-color:var(--rose)}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.progress>div,.bar>div{transition:none}}
.result-name{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:4px}
.result-lang{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:700;color:var(--berry);text-align:center;line-height:1.25;margin-bottom:14px}
.result-desc{background:var(--blush);border-radius:14px;padding:15px 17px;font-size:.92rem;line-height:1.6;margin-bottom:20px}
.result-desc strong{color:var(--berry)}
.bar-row{margin-bottom:11px}
.bar-label{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;margin-bottom:5px}
.bar-label span:last-child{color:var(--muted);font-weight:500}
.bar{height:10px;background:var(--blush);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--rose);border-radius:99px;width:0%;transition:width .8s ease .15s}
.bar.top>div{background:var(--berry)}
.days-title{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;color:var(--berry);margin:20px 0 4px;text-align:center}
.days-sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:12px}
.day-row{display:flex;align-items:flex-start;gap:10px;background:var(--blush);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.day-badge{flex:none;background:var(--berry);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:4px 9px;margin-top:1px;white-space:nowrap}
.day-text{font-size:.86rem;line-height:1.45}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border:none;border-radius:14px;background:#1faa55;color:#fff;font:700 1rem 'Karla',sans-serif;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(.92)}.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.btn.secondary{background:transparent;color:var(--berry);border:1.5px solid var(--berry);margin-top:10px}
.btn.secondary:hover{background:var(--blush);filter:none}
.footer-note{text-align:center;font-size:.74rem;color:var(--muted);margin-top:14px;font-style:italic}
</style>
</head>
<body>
<main class="card" id="app"></main>
<script>
const LANGS={A:{nome:"Manifestação de Arrependimento",emoji:"💔",desc:"Você precisa <strong>sentir o arrependimento</strong> de quem te magoou: um “eu sinto muito” verdadeiro, dito com emoção, reconhecendo a dor causada. Sem isso, as desculpas soam vazias.",descEu:"Eu preciso sentir o seu arrependimento: um “eu sinto muito” verdadeiro, dito com emoção, reconhecendo a dor que me causou. Sem isso, as desculpas soam vazias para mim."},B:{nome:"Aceitação da Responsabilidade",emoji:"✋",desc:"Para você, desculpa sincera é <strong>admitir o erro</strong>: “eu errei, a culpa foi minha” — sem justificativas, sem “mas”, sem dividir a culpa. Reconhecer o erro vale mais do que mil explicações.",descEu:"Para mim, desculpa sincera é admitir o erro: “eu errei, a culpa foi minha” — sem justificativas, sem “mas”, sem dividir a culpa comigo. Reconhecer o erro vale mais do que mil explicações."},C:{nome:"Compensação do Prejuízo",emoji:"🛠️",desc:"Você acredita que <strong>arrependimento se prova com reparação</strong>: quem errou pergunta “o que posso fazer para consertar?” — e age. Palavras importam, mas é o gesto concreto que cura a ferida.",descEu:"Eu acredito que arrependimento se prova com reparação: quando você erra, pergunte “o que posso fazer para consertar?” — e aja. Palavras importam, mas é o gesto concreto que cura a minha ferida."},D:{nome:"Arrependimento Genuíno",emoji:"🌱",desc:"Para você, a melhor desculpa é a <strong>mudança</strong>: ver um plano real para não repetir o erro e perceber o esforço dia após dia. Desculpas repetidas sem mudança perdem o valor.",descEu:"Para mim, a melhor desculpa é a mudança: quero ver um plano real para não repetir o erro e perceber o seu esforço dia após dia. Desculpas repetidas sem mudança perdem o valor."},E:{nome:"Pedido de Perdão",emoji:"🙏",desc:"Você precisa <strong>ouvir o pedido</strong>: “você me perdoa?”. Essa pergunta devolve a você a escolha de perdoar e mostra a humildade de quem errou — sem ela, falta o passo final da reconciliação.",descEu:"Eu preciso ouvir o pedido: “você me perdoa?”. Essa pergunta me devolve a escolha de perdoar e mostra a sua humildade — sem ela, falta o passo final da nossa reconciliação."}};
const CHECKS={A:["Diga “eu sinto muito” olhando nos meus olhos","Nomeie o que fez: “sinto muito por ter falado daquele jeito”","Reconheça a dor que me causou, sem minimizar","Evite o “desculpa” automático e apressado — eu percebo a diferença","Se for difícil falar, escreva um bilhete ou mensagem com o seu arrependimento","Demonstre no tom de voz e no olhar que você sente de verdade","Nunca emende a desculpa com cobrança: “desculpa, MAS você também...”"],B:["Diga com clareza: “eu errei, a culpa foi minha”","Não use “mas” depois de admitir o erro","Não divida a culpa comigo na hora de se desculpar","Evite justificativas: “eu estava cansado(a), estressado(a)...”","Admita o seu erro mesmo quando eu também tiver a minha parcela","Reconheça o erro também na frente de quem presenciou","Seja específico(a) sobre o que fez de errado, sem rodeios"],C:["Pergunte: “o que posso fazer para reparar isso?”","Aja para corrigir o que o erro causou — não só fale","Substitua, conserte ou refaça o que foi prejudicado","Compense com um gesto de amor na minha linguagem","Cumpra a reparação prometida, mesmo que custe algo a você","Não considere o assunto encerrado antes de reparar","Mostre com um gesto que a nossa relação importa mais que o orgulho"],D:["Diga: “vou mudar esse comportamento” — e explique como","Crie um plano concreto para não repetir o erro","Me peça ajuda para perceber quando estiver recaindo","Aceite ser lembrado(a) do combinado sem se irritar","Mostre pequenos progressos todos os dias","Se falhar, recomece — sem desistir da mudança","Depois de um tempo, me pergunte se eu percebi a diferença"],E:["Me pergunte diretamente: “você me perdoa?”","Depois de perguntar, espere a minha resposta sem pressão","Respeite se eu precisar de um tempo para perdoar","Não exija o perdão imediato como obrigação","Pergunte de novo, com paciência, se eu ainda não estiver pronto(a)","Agradeça quando eu perdoar — isso sela a nossa reconciliação","Ore comigo pedindo que Deus restaure o que foi ferido"]};
const PERGUNTAS=[["A","Ouvir um sincero “eu sinto muito por ter te magoado”.","B","Ouvir “eu errei, a culpa foi minha” — sem justificativas."],["C","Ver a pessoa se esforçar para consertar o que fez.","D","Ver um compromisso real de que aquilo não vai se repetir."],["E","Ouvir a pergunta: “você me perdoa?”.","A","Perceber que a pessoa está genuinamente triste por ter me ferido."],["B","A pessoa admitir o erro com clareza, sem se defender.","C","A pessoa perguntar: “o que posso fazer para reparar isso?”."],["D","Ver mudança de atitude real nos dias seguintes.","E","A pessoa pedir perdão com humildade — e esperar a minha resposta."],["A","Sentir que a pessoa entende a dor que me causou.","C","Receber um gesto concreto que compense o que aconteceu."],["B","Ouvir “eu estava errado(a)” sem nenhum “mas...”.","D","Ouvir um plano específico: “vou fazer diferente assim...”."],["E","Que a pessoa reconheça que perdoar é uma escolha minha.","C","Que a pessoa repare o prejuízo, mesmo que custe algo a ela."],["A","Palavras que expressem arrependimento de coração.","D","Ações que provem o arrependimento ao longo do tempo."],["B","Que assuma a responsabilidade sem dividir a culpa comigo.","E","Que me pergunte diretamente: “você pode me perdoar?”."]];
let idx=0,placar={A:0,B:0,C:0,D:0,E:0};const app=document.getElementById("app");
function makeHearts(){const d=document.createElement("div");d.className="hearts";d.setAttribute("aria-hidden","true");["#7FA08F","#E6EEE8"].forEach(fill=>{const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 24 24");const path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("fill",fill);path.setAttribute("d","M12 21s-7.5-4.9-10-9.2C.4 8.6 2 5 5.5 5 7.7 5 9.3 6.3 12 9c2.7-2.7 4.3-4 6.5-4C22 5 23.6 8.6 22 11.8 19.5 16.1 12 21 12 21z");svg.appendChild(path);d.appendChild(svg);});return d;}
function telaPergunta(){const[l1,t1,l2,t2]=PERGUNTAS[idx];const pct=Math.round((idx/PERGUNTAS.length)*100);const ops=idx%2===1?[[l2,t2],[l1,t1]]:[[l1,t1],[l2,t2]];const inner=document.createElement("div");inner.className="inner fade";inner.appendChild(makeHearts());const ey=document.createElement("p");ey.className="eyebrow";ey.textContent="As 5 Linguagens do Perdão";inner.appendChild(ey);const pw=document.createElement("div");pw.className="progress-wrap";const pr=document.createElement("div");pr.className="progress";pr.setAttribute("role","progressbar");pr.setAttribute("aria-valuenow",String(idx+1));pr.setAttribute("aria-valuemin","1");pr.setAttribute("aria-valuemax",String(PERGUNTAS.length));const pbar=document.createElement("div");pbar.id="pbar";pr.appendChild(pbar);const cnt=document.createElement("span");cnt.className="count";cnt.textContent=(idx+1)+" / "+PERGUNTAS.length;pw.appendChild(pr);pw.appendChild(cnt);inner.appendChild(pw);const qt=document.createElement("p");qt.className="qtitle";qt.textContent="Um pedido de desculpas me alcança quando…";inner.appendChild(qt);const qs=document.createElement("p");qs.className="qsub";qs.textContent="Toque na opção que mais fala ao seu coração:";inner.appendChild(qs);ops.forEach(function([lang,txt]){const btn=document.createElement("button");btn.className="opt";btn.textContent=txt;btn.dataset.lang=lang;btn.addEventListener("click",function(){responder(this.dataset.lang);});inner.appendChild(btn);});app.innerHTML="";app.appendChild(inner);requestAnimationFrame(function(){const b=document.getElementById("pbar");if(b)b.style.width=pct+"%";});}
function responder(lang){placar[lang]++;idx++;if(idx<PERGUNTAS.length)telaPergunta();else telaResultado();}
function telaResultado(){const ordenado=Object.entries(placar).sort((a,b)=>b[1]-a[1]);const top=ordenado[0][0];const L=LANGS[top];const MAX=4;const inner=document.createElement("div");inner.className="inner fade";inner.appendChild(makeHearts());const ey=document.createElement("p");ey.className="eyebrow";ey.textContent="Resultado";inner.appendChild(ey);const rn=document.createElement("p");rn.className="result-name";rn.textContent="Sua principal linguagem do perdão é:";inner.appendChild(rn);const rl=document.createElement("p");rl.className="result-lang";rl.textContent=L.emoji+" "+L.nome;inner.appendChild(rl);const rd=document.createElement("div");rd.className="result-desc";rd.innerHTML=L.desc;inner.appendChild(rd);ordenado.forEach(function([k,v],i){const br=document.createElement("div");br.className="bar-row";const bl=document.createElement("div");bl.className="bar-label";const s1=document.createElement("span");s1.textContent=(i+1)+"º  "+LANGS[k].emoji+" "+LANGS[k].nome;const s2=document.createElement("span");s2.textContent=v+" pts";bl.appendChild(s1);bl.appendChild(s2);const bw=document.createElement("div");bw.className="bar"+(i===0?" top":"");const bd=document.createElement("div");bd.dataset.w=String(Math.round((v/MAX)*100));bw.appendChild(bd);br.appendChild(bl);br.appendChild(bw);inner.appendChild(br);});const dt=document.createElement("p");dt.className="days-title";dt.textContent="🤍 7 compromissos para o seu cônjuge";inner.appendChild(dt);const ds=document.createElement("p");ds.className="days-sub";ds.textContent="Como pedir perdão na sua linguagem — isso vai junto na mensagem:";inner.appendChild(ds);CHECKS[top].forEach(function(item,i){const dr=document.createElement("div");dr.className="day-row";const db=document.createElement("span");db.className="day-badge";db.textContent=(i+1)+"º";const dt2=document.createElement("span");dt2.className="day-text";dt2.textContent=item;dr.appendChild(db);dr.appendChild(dt2);inner.appendChild(dr);});const btnWA=document.createElement("button");btnWA.className="btn";btnWA.textContent="Enviar para meu cônjuge no WhatsApp 💌";btnWA.addEventListener("click",enviarWhatsApp);inner.appendChild(btnWA);const fn1=document.createElement("p");fn1.className="footer-note";fn1.style.marginTop="8px";fn1.textContent="Abre o WhatsApp para você escolher o contato do seu cônjuge, com uma mensagem pronta em primeira pessoa + os 7 compromissos de reconciliação.";inner.appendChild(fn1);const btnR=document.createElement("button");btnR.className="btn secondary";btnR.textContent="Refazer · passar para o cônjuge 💑";btnR.addEventListener("click",reiniciar);inner.appendChild(btnR);const fn2=document.createElement("p");fn2.className="footer-note";fn2.textContent='"Perdoando-vos uns aos outros…" (Ef 4:32) · 2 Corações, 1 Só Propósito';inner.appendChild(fn2);app.innerHTML="";app.appendChild(inner);requestAnimationFrame(function(){document.querySelectorAll(".bar > div").forEach(function(d){d.style.width=Math.min(100,+d.dataset.w)+"%";});});}
function reiniciar(){idx=0;placar={A:0,B:0,C:0,D:0,E:0};telaPergunta();}
function enviarWhatsApp(){const ordenado=Object.entries(placar).sort((a,b)=>b[1]-a[1]);const top=ordenado[0][0];const L=LANGS[top];const itens=CHECKS[top].map(function(item,i){return"◻️ *"+(i+1)+"º:* "+item;}).join("\n");const ranking=ordenado.map(function([k,v],i){return(i+1)+"º "+LANGS[k].emoji+" "+LANGS[k].nome+" — "+v+" pts";}).join("\n");const msg="💌 *Uma mensagem para você, meu amor*\n\nAcabei de fazer o quiz das 5 Linguagens do Perdão e quero dividir o resultado com você — porque quero que os nossos recomeços sejam tão fortes quanto o nosso amor.\n\n"+L.emoji+" *A minha linguagem do perdão é: "+L.nome+"*\n\n"+L.descEu+"\n\n📊 *Como pontuei (do maior para o menor):*\n"+ranking+"\n\n🤍 *Nossos 7 compromissos — como pedir perdão na minha linguagem:*\n"+itens+"\n\n💍 *Combinado:* guarde esta mensagem. Quando um de nós magoar o outro, voltamos a este guia — porque casamento saudável não é o que nunca erra, é o que sabe reparar os erros.\n\n_\"Perdoando-vos uns aos outros…\" (Efésios 4:32)_\n*2 Corações, 1 Só Propósito*";window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");}
telaPergunta();
</script>
</body>
</html>
